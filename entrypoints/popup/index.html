<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>See Browse</title>
    <style>
      body {
        font-family: sans-serif;
        width: 300px;
        padding: 16px;
        margin: 0;
        box-sizing: border-box;
      }
      h2 {
        margin: 0 0 12px 0;
        font-size: 18px;
        color: #1e293b;
        text-align: center;
      }
      .field {
        margin-bottom: 12px;
        text-align: left;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #475569;
      }
      input[type="password"], input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 13px;
      }
      button {
        padding: 10px 16px;
        background: #10a37f;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      button:hover { background: #0e906f; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      #message { margin-top: 12px; font-size: 13px; color: #555; text-align: center; }
      #ask-user-prompt {
        margin: 12px 0;
        padding: 10px;
        background: #fff3cd;
        border: 1px solid #ffc107;
        border-radius: 4px;
        font-size: 13px;
        text-align: left;
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>See Browse</h2>
    <div class="field">
      <label for="api-key">Gemini API Key</label>
      <input type="password" id="api-key" placeholder="Enter Gemini API Key..." />
    </div>
    <div id="ask-user-prompt"></div>
    <button id="start-btn">Start Agent</button>
    <button id="continue-btn" style="display: none; background: #2563eb;">Continue</button>
    <p id="message"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
