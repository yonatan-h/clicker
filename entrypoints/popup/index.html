<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>See Browse</title>
    <style>
      body {
        font-family: sans-serif;
        width: 300px;
        padding: 20px;
        text-align: center;
      }
      button {
        padding: 10px 16px;
        background: #10a37f;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      button:hover { background: #0e906f; }
      #message { margin-top: 15px; font-size: 14px; color: #555; }
      #ask-user-prompt {
        margin: 12px 0;
        padding: 10px;
        background: #fff3cd;
        border: 1px solid #ffc107;
        border-radius: 4px;
        font-size: 13px;
        text-align: left;
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>See Browse</h2>
    <div id="ask-user-prompt"></div>
    <button id="start-btn">Start Agent</button>
    <button id="continue-btn" style="display: none; background: #2563eb;">Continue</button>
    <p id="message"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
